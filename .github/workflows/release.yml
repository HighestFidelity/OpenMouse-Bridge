name: Bridge Stable Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The Node.js runtime bundled into native-hid/node/ so Bridge can push
  # DPI/polling-rate settings to non-Pulsar mice without end users needing
  # Node.js installed separately. Bump by hand when a newer LTS ships.
  NATIVE_HID_NODE_VERSION: v24.18.1
  # Bump together with NATIVE_HID_NODE_VERSION: the SHA-256 of each archive
  # below, from https://nodejs.org/dist/<version>/SHASUMS256.txt.
  NATIVE_HID_NODE_SHA256_DARWIN_ARM64: eb02f7fab96d3d67de40c5ec8566096fcb4c2026728787683ae5a97eb612b941
  NATIVE_HID_NODE_SHA256_DARWIN_X64: 6fb20fceacbb157c2f95825b80df4a454a0f6d81cdcd7bb81eeae9147e0e76ec
  NATIVE_HID_NODE_SHA256_LINUX_X64: d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0
  NATIVE_HID_NODE_SHA256_WIN_X64: ec56b84a7551893ab2324ebdfdc4ab974a63b4781162600b68a1293cc3e53765

jobs:
  preflight:
    name: Check the version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      # Fails in a minute, before an hour of builds, when the tag, Cargo.toml
      # and CHANGELOG.md disagree.
      - name: Verify tag matches Cargo version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      # A release without code signing must not ship (audit N9): fail here
      # instead of publishing unsigned builds. Only whether the secrets exist
      # is read, never their values.
      - name: Require signing secrets
        env:
          HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
        run: |
          missing=0
          if [ "$HAS_WINDOWS_SIGNING" != true ]; then
            echo '::error::WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD are not set; refusing to ship unsigned Windows builds.'
            missing=1
          fi
          if [ "$HAS_MAC_SIGNING" != true ]; then
            echo '::error::MACOS_CERTIFICATE_BASE64 / MACOS_SIGN_IDENTITY are not set; refusing to ship ad-hoc signed macOS builds.'
            missing=1
          fi
          exit "$missing"
      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { changelogEntry, versionFromTag } from "./.github/scripts/make-release-files.mjs";
            changelogEntry(readFileSync("CHANGELOG.md", "utf8"), versionFromTag(process.argv[1]));
          ' "$GITHUB_REF_NAME"
  windows:
    name: Windows x64
    needs: preflight
    runs-on: windows-latest
    # Not secrets: whether the signing secrets exist. The secrets themselves
    # are passed only to the steps that sign.
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-hid/package-lock.json
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Test native HID helper
        run: |
          npm ci --prefix native-hid
          npm test --prefix native-hid
      - name: Sign executable
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "openmouse-bridge.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD target/release/openmouse-bridge.exe
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --prefix native-hid --omit=dev
          # Trim node-hid's other-platform prebuilt bindings — this archive
          # only ever runs on win32-x64.
          Get-ChildItem native-hid/node_modules/node-hid/prebuilds -Directory |
            Where-Object { $_.Name -ne "HID-win32-x64" } |
            Remove-Item -Recurse -Force
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NATIVE_HID_NODE_VERSION/node-$env:NATIVE_HID_NODE_VERSION-win-x64.zip" -OutFile node.zip
          # Verify the archive against its pinned SHA-256 before extracting.
          $nodeZipHash = (Get-FileHash node.zip -Algorithm SHA256).Hash
          if ($nodeZipHash -ne $env:NATIVE_HID_NODE_SHA256_WIN_X64) { throw "node.zip SHA-256 mismatch: got $nodeZipHash" }
          Expand-Archive node.zip -DestinationPath node-extracted
          New-Item -ItemType Directory -Force -Path native-hid/node | Out-Null
          Copy-Item "node-extracted/node-$env:NATIVE_HID_NODE_VERSION-win-x64/node.exe" native-hid/node/node.exe
      - name: Package
        shell: pwsh
        run: |
          Copy-Item assets/fonts/DM-Sans-OFL.txt DM-Sans-OFL.txt
          Compress-Archive -Path target/release/openmouse-bridge.exe,README.md,DM-Sans-OFL.txt,native-hid -DestinationPath openmouse-bridge-windows-x64-full.zip
          (Get-FileHash openmouse-bridge-windows-x64-full.zip -Algorithm SHA256).Hash.ToLower() + "  openmouse-bridge-windows-x64-full.zip" | Set-Content openmouse-bridge-windows-x64-full.zip.sha256
          # Small bridge archive under the original name for the older updaters
          # (they cannot open archives over 16 MiB); see
          # packaging/bridge/build-bridge-package.sh.
          $stage = Join-Path $env:RUNNER_TEMP "bridge-package"
          New-Item -ItemType Directory -Force -Path "$stage/native-hid/node", "$stage/native-hid/node_modules/node-hid", "$stage/native-hid/node_modules/@openmouse/protocol", "$stage/native-hid/node_modules/@openmouse/keyboard-protocol" | Out-Null
          Copy-Item target/release/openmouse-bridge.exe, README.md, DM-Sans-OFL.txt $stage
          Copy-Item native-hid/package.json "$stage/native-hid/"
          Copy-Item native-hid/src "$stage/native-hid/src" -Recurse
          Copy-Item native-hid/node_modules/node-hid/package.json "$stage/native-hid/node_modules/node-hid/"
          Copy-Item native-hid/node_modules/@openmouse/protocol/package.json "$stage/native-hid/node_modules/@openmouse/protocol/"
          Copy-Item native-hid/node_modules/@openmouse/keyboard-protocol/package.json "$stage/native-hid/node_modules/@openmouse/keyboard-protocol/"
          Set-Content "$stage/native-hid/node/node.exe" "Placeholder: Bridge replaces this with the real Node.js runtime on first launch."
          Compress-Archive -Path "$stage/*" -DestinationPath openmouse-bridge-windows-x64.zip -CompressionLevel Optimal
          $size = (Get-Item openmouse-bridge-windows-x64.zip).Length
          Write-Host "openmouse-bridge-windows-x64.zip: $size bytes (limit 16252928)"
          if ($size -gt 16252928) { throw "bridge archive is over the older updaters' 16 MiB read budget" }
          (Get-FileHash openmouse-bridge-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  openmouse-bridge-windows-x64.zip" | Set-Content openmouse-bridge-windows-x64.zip.sha256
      - name: Build and smoke test Windows installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'bridge-windows-installer-package'
          Expand-Archive openmouse-bridge-windows-x64-full.zip -DestinationPath $stage
          ./packaging/windows/build-installer.ps1 -Stage $stage -OutputDirectory .
      - name: Sign Windows installer
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = Join-Path $env:RUNNER_TEMP 'openmouse-bridge.pfx'
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD OpenMouse-Bridge-windows-x64-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
          $checksum = (Get-FileHash OpenMouse-Bridge-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower() + '  OpenMouse-Bridge-windows-x64-setup.exe' + "`n"
          [IO.File]::WriteAllText('OpenMouse-Bridge-windows-x64-setup.exe.sha256', $checksum, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-windows
          path: |
            openmouse-bridge-windows-x64.zip
            openmouse-bridge-windows-x64.zip.sha256
            openmouse-bridge-windows-x64-full.zip
            openmouse-bridge-windows-x64-full.zip.sha256
            OpenMouse-Bridge-windows-x64-setup.exe
            OpenMouse-Bridge-windows-x64-setup.exe.sha256

  macos:
    name: macOS universal
    needs: preflight
    runs-on: macos-15
    # Signing and notarization are automatic when these secrets exist;
    # preflight refuses to release without the signing ones (audit N9).
    # The flags say whether the secrets exist; the secrets themselves are
    # passed only to the steps that use them.
    env:
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      HAS_MAC_NOTARIZATION: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-hid/package-lock.json
      - run: cargo fmt --check
      - run: cargo test --locked
        env:
          OPENMOUSE_SKIP_IOHID_TEST: "1"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Test native HID helper
        run: |
          npm ci --prefix native-hid
          npm test --prefix native-hid
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        run: |
          set -euo pipefail
          npm ci --prefix native-hid --omit=dev
          # Trim node-hid's non-macOS prebuilt bindings; keep both Apple
          # silicon and Intel since the Bridge binary itself is universal.
          find native-hid/node_modules/node-hid/prebuilds -mindepth 1 -maxdepth 1 -type d \
            ! -name HID-darwin-arm64 ! -name HID-darwin-x64 -exec rm -rf {} +
          # Verify each archive against its pinned SHA-256 before extracting.
          arm64_tar="$RUNNER_TEMP/node-$NATIVE_HID_NODE_VERSION-darwin-arm64.tar.gz"
          x64_tar="$RUNNER_TEMP/node-$NATIVE_HID_NODE_VERSION-darwin-x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-max-time 120 -o "$arm64_tar" "https://nodejs.org/dist/$NATIVE_HID_NODE_VERSION/node-$NATIVE_HID_NODE_VERSION-darwin-arm64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-max-time 120 -o "$x64_tar" "https://nodejs.org/dist/$NATIVE_HID_NODE_VERSION/node-$NATIVE_HID_NODE_VERSION-darwin-x64.tar.gz"
          printf '%s  %s\n' "$NATIVE_HID_NODE_SHA256_DARWIN_ARM64" "$arm64_tar" "$NATIVE_HID_NODE_SHA256_DARWIN_X64" "$x64_tar" | shasum -a 256 -c
          tar -xzf "$arm64_tar"
          tar -xzf "$x64_tar"
          mkdir -p native-hid/node/bin
          lipo -create \
            "node-$NATIVE_HID_NODE_VERSION-darwin-arm64/bin/node" \
            "node-$NATIVE_HID_NODE_VERSION-darwin-x64/bin/node" \
            -output native-hid/node/bin/node
          chmod +x native-hid/node/bin/node
      - name: Package universal binary (existing bare-binary installs)
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/openmouse-bridge \
            target/x86_64-apple-darwin/release/openmouse-bridge \
            -output openmouse-bridge
          chmod +x openmouse-bridge
          cp assets/fonts/DM-Sans-OFL.txt ./DM-Sans-OFL.txt
          zip -r openmouse-bridge-macos-universal-full.zip openmouse-bridge README.md DM-Sans-OFL.txt native-hid
          shasum -a 256 openmouse-bridge-macos-universal-full.zip > openmouse-bridge-macos-universal-full.zip.sha256
          # Small bridge archive under the original name for the older updaters.
          packaging/bridge/build-bridge-package.sh openmouse-bridge openmouse-bridge-macos-universal.zip
          shasum -a 256 openmouse-bridge-macos-universal.zip > openmouse-bridge-macos-universal.zip.sha256
      - name: Import signing certificate
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/openmouse-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build OpenMouse Bridge.app
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          packaging/macos/build-app.sh openmouse-bridge native-hid "$version" dist
      - name: Notarize app
        if: env.HAS_MAC_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/OpenMouse Bridge.app" notarize-app.zip
          xcrun notarytool submit notarize-app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/OpenMouse Bridge.app"
      - name: Package DMG and app update archive
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # Homebrew Python is externally managed (PEP 668), so use a venv.
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --quiet dmgbuild==1.6.7
          export PATH="$RUNNER_TEMP/dmgbuild-venv/bin:$PATH"
          packaging/macos/build-dmg.sh "dist/OpenMouse Bridge.app" OpenMouse-Bridge-macos-universal.dmg
          # Plain Info-ZIP (not ditto): the updater's strict extractor expects ordinary zip entries.
          (cd dist && zip -r -X -q "../openmouse-bridge-macos-app.zip" "OpenMouse Bridge.app")
          shasum -a 256 openmouse-bridge-macos-app.zip > openmouse-bridge-macos-app.zip.sha256
      - name: Notarize DMG
        if: env.HAS_MAC_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit OpenMouse-Bridge-macos-universal.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple OpenMouse-Bridge-macos-universal.dmg
      - name: Verify DMG
        run: |
          set -euo pipefail
          hdiutil attach OpenMouse-Bridge-macos-universal.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          test -d "$RUNNER_TEMP/dmg/OpenMouse Bridge.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/OpenMouse Bridge.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-macos
          path: |
            openmouse-bridge-macos-universal.zip
            openmouse-bridge-macos-universal.zip.sha256
            openmouse-bridge-macos-universal-full.zip
            openmouse-bridge-macos-universal-full.zip.sha256
            openmouse-bridge-macos-app.zip
            openmouse-bridge-macos-app.zip.sha256
            OpenMouse-Bridge-macos-universal.dmg
  linux:
    name: Linux x64
    needs: preflight
    # The oldest runner image on offer, so the AppImage runs on any distro
    # whose glibc is at least that old (as in gpui-build.yml).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Linux HID and GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config libudev-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev libgl1-mesa-dev libfontconfig-dev libfreetype-dev libasound2-dev appstream
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-hid/package-lock.json
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Test native HID helper
        run: |
          npm ci --prefix native-hid
          npm test --prefix native-hid
      - name: Prepare native-hid (deps + bundled Node.js runtime)
        run: |
          set -euo pipefail
          npm ci --prefix native-hid --omit=dev
          # Trim node-hid's non-Linux prebuilt bindings; this archive only
          # ever runs on linux-x64.
          find native-hid/node_modules/node-hid/prebuilds -mindepth 1 -maxdepth 1 -type d \
            ! -name HID-linux-x64 -exec rm -rf {} +
          # Verify the archive against its pinned SHA-256 before extracting.
          node_tar="$RUNNER_TEMP/node-$NATIVE_HID_NODE_VERSION-linux-x64.tar.xz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-max-time 120 -o "$node_tar" "https://nodejs.org/dist/$NATIVE_HID_NODE_VERSION/node-$NATIVE_HID_NODE_VERSION-linux-x64.tar.xz"
          printf '%s  %s\n' "$NATIVE_HID_NODE_SHA256_LINUX_X64" "$node_tar" | sha256sum -c
          tar -xJf "$node_tar"
          mkdir -p native-hid/node/bin
          cp "node-$NATIVE_HID_NODE_VERSION-linux-x64/bin/node" native-hid/node/bin/node
          chmod +x native-hid/node/bin/node
      - name: Package
        run: |
          cp target/release/openmouse-bridge ./openmouse-bridge
          chmod +x openmouse-bridge
          cp assets/openmouse-app-icon.png ./openmouse-app-icon.png
          cp assets/fonts/DM-Sans-OFL.txt ./DM-Sans-OFL.txt
          zip -r openmouse-bridge-linux-x64-full.zip openmouse-bridge openmouse-app-icon.png README.md DM-Sans-OFL.txt native-hid
          sha256sum openmouse-bridge-linux-x64-full.zip > openmouse-bridge-linux-x64-full.zip.sha256
          # Small bridge archive under the original name for the older updaters.
          packaging/bridge/build-bridge-package.sh openmouse-bridge openmouse-bridge-linux-x64.zip openmouse-app-icon.png
          rm openmouse-bridge openmouse-app-icon.png
          sha256sum openmouse-bridge-linux-x64.zip > openmouse-bridge-linux-x64.zip.sha256
      # The AppImage is the Linux install the in-app updater updates. Same
      # steps as gpui-build.yml; keep them in sync.
      - name: Assemble the AppDir
        run: |
          set -euo pipefail
          appdir=AppDir
          # Bridge finds native-hid next to its executable, so they sit together.
          install -Dm755 target/release/openmouse-bridge "$appdir/usr/bin/openmouse-bridge"
          cp -R native-hid "$appdir/usr/bin/native-hid"
          cp assets/fonts/DM-Sans-OFL.txt README.md "$appdir/usr/bin/"
          cp assets/openmouse-app-icon.png "$appdir/io.openmouse.bridge.png"
          cp assets/openmouse-app-icon.png "$appdir/.DirIcon"
          install -Dm644 packaging/linux/io.openmouse.bridge.appdata.xml \
            "$appdir/usr/share/metainfo/io.openmouse.bridge.appdata.xml"
          cat > "$appdir/io.openmouse.bridge.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=OpenMouse Bridge
          Comment=Local companion for the OpenMouse control panel
          Exec=openmouse-bridge
          Icon=io.openmouse.bridge
          Categories=Utility;
          Terminal=false
          DESKTOP
          install -Dm644 "$appdir/io.openmouse.bridge.desktop" \
            "$appdir/usr/share/applications/io.openmouse.bridge.desktop"
          install -Dm644 assets/openmouse-app-icon.png \
            "$appdir/usr/share/icons/hicolor/512x512/apps/io.openmouse.bridge.png"
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/openmouse-bridge" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"
          appstreamcli validate --no-net "$appdir/usr/share/metainfo/io.openmouse.bridge.appdata.xml"
      - name: Build the AppImage
        run: |
          set -euo pipefail
          # Pinned release, verified before it runs. Bump the URL and hash together.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          # Runners have no FUSE, so the tool unpacks itself and runs from there.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir OpenMouse-Bridge-linux-x86_64.AppImage
          sha256sum OpenMouse-Bridge-linux-x86_64.AppImage > OpenMouse-Bridge-linux-x86_64.AppImage.sha256
      - name: Check the AppImage contents
        run: |
          set -euo pipefail
          chmod +x OpenMouse-Bridge-linux-x86_64.AppImage
          ./OpenMouse-Bridge-linux-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/openmouse-bridge
          test -x squashfs-root/usr/bin/native-hid/node/bin/node
          test -f squashfs-root/usr/bin/native-hid/src/apply.mjs
          test -f squashfs-root/usr/bin/DM-Sans-OFL.txt
          test -f squashfs-root/usr/share/metainfo/io.openmouse.bridge.appdata.xml
          test -f squashfs-root/usr/share/applications/io.openmouse.bridge.desktop
          # Every shared library the binary needs must resolve on this machine.
          ! ldd squashfs-root/usr/bin/openmouse-bridge | grep 'not found'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-linux
          path: |
            openmouse-bridge-linux-x64.zip
            openmouse-bridge-linux-x64.zip.sha256
            openmouse-bridge-linux-x64-full.zip
            openmouse-bridge-linux-x64-full.zip.sha256
            OpenMouse-Bridge-linux-x86_64.AppImage
            OpenMouse-Bridge-linux-x86_64.AppImage.sha256
          if-no-files-found: error
  release:
    name: Publish stable release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    # Only this job writes: it creates or updates the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Write latest.json and the release notes
        # latest.json is what the in-app updater reads
        # (releases/latest/download/latest.json): the version, its
        # CHANGELOG.md entry, and each platform's asset with its SHA-256.
        run: |
          set -euo pipefail
          mkdir release
          node .github/scripts/make-release-files.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" artifacts release
          cat release/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never overwrite what a tag already published (audit N9): a re-run
          # may add assets that are missing, but an asset that exists makes
          # the upload fail. To re-cut, delete the release by hand or bump the
          # version.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" artifacts/* release/latest.json
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          else
            # Pre-release tags (v1.2.0-rc.1) are never latest, so the
            # updater's releases/latest/download/latest.json skips them.
            prerelease="$(node --input-type=module -e '
              import { isPrerelease } from "./.github/scripts/make-release-files.mjs";
              console.log(isPrerelease(process.argv[1]));
            ' "$GITHUB_REF_NAME")"
            if [ "$prerelease" = true ]; then
              channel=(--prerelease --latest=false)
            else
              channel=(--latest)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file release/notes.md \
              "${channel[@]}" \
              artifacts/* release/latest.json
          fi
